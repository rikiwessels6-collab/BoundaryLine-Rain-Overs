name: BoundaryLineRain
options:
  bundleIdPrefix: com.boundarylineapps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BoundaryLineRain:
    type: application
    platform: iOS
    sources: [Sources/BoundaryLineRain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.rainovers   # placeholder: confirm before TestFlight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BoundaryLine Rain & Overs"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  BoundaryLineRainTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BoundaryLineRain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.rainovers.tests
schemes:
  BoundaryLineRain:
    build:
      targets:
        BoundaryLineRain: all
    test:
      targets: [BoundaryLineRainTests]
